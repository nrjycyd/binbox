name: Update Binaries

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重建 release（忽略版本未变更，全量重新下载上传）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: update-binaries
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt update -y
          sudo apt install -y curl unzip jq yq tar gzip binutils
          sudo apt install -y minisign || echo "minisign 不可用，跳过"

      - name: Run update script
        id: update
        run: bash .github/workflows/fetch-binaries.sh
        env:
          FORCE_REBUILD: ${{ inputs.force }}

      - name: Commit manifest
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update manifest $(date '+%F %T')"
            git push origin HEAD:main
          fi

      - name: 🚀 创建 GitHub Release
        # 自定义 if 会替换默认 success() 检查，必须显式带 success()，否则构建失败后仍会执行
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 从 manifest.json 生成发布说明
          RELEASE_NOTES=$(jq -r '
            "## 📦 二进制镜像更新\n\n" +
            "| 程序 | 版本 | 文件数 |\n|---|---|---|\n" +
            ([.binaries | to_entries[] | "| \(.key) | \(.value.version) | \(.value.assets | length) |"] | join("\n")) +
            "\n\n- 更新于: " + .updated_at +
            "\n- 状态: " + .status +
            "\n- 最新 release: `pkgs` · 备份 release: `pkgs-prev`"
          ' manifest.json)

          # 同 tag 复用：pkgs 已存在则刷新说明并追加 manifest，不存在则创建
          if gh release view pkgs >/dev/null 2>&1; then
              gh release edit pkgs --notes "$RELEASE_NOTES" --latest
              gh release upload pkgs manifest.json --clobber
              echo "✅ Release 已存在，说明已更新"
          else
              gh release create pkgs manifest.json --title "pkgs" --notes "$RELEASE_NOTES" --latest
              echo "✅ Release 创建完成"
          fi

      - name: Notify on failure
        if: hashFiles('.update_report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🤖 二进制更新失败 $(date '+%F %T')" \
            --body "$(cat .update_report.md)" \
            --repo "$GITHUB_REPOSITORY"
