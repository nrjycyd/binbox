name: Update Binaries

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-binaries
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt update -y
          sudo apt install -y curl unzip jq yq tar gzip binutils
          sudo apt install -y minisign || echo "minisign 不可用，跳过"

      - name: Run update script
        id: update
        run: bash .github/workflows/fetch-binaries.sh

      - name: Commit manifest
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update manifest $(date '+%F %T')"
            git push origin HEAD:main
          fi

      - name: Notify on failure
        if: hashFiles('.update_report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🤖 二进制更新失败 $(date '+%F %T')" \
            --body "$(cat .update_report.md)" \
            --repo "$GITHUB_REPOSITORY"
