# ====================================================================
# 二进制更新清单参数说明
#
# 每个条目（binaries）代表一个需要自动更新的二进制程序
#
# 字段说明：
#   name         : 程序名称，用于本地存放目录和日志显示
#   repo         : GitHub 仓库地址，格式 "owner/repo"
#   keyword      : 匹配 release 文件名的关键字，可用 "|" 分隔多个关键字
#   exec         : 可执行文件名，用于设置执行权限
#   type         : 文件类型，可用 "|" 分隔（如 deb|tar.gz|tar.xz|gz|zip|ipk）
#   extract      : 是否解压压缩包，值为 false 或指定类型（tar.gz|tar.xz|gz|zip|...），可用 "|" 分隔
#   keep_pkg     : 是否保留下载的压缩包，仅对 extract 有效，值为 false 或指定类型
#   target_base  : 下载/解压文件的目标目录，相对仓库根目录，根目录用 "."
#   folder_rename: 自定义末级目录名称，值为 false 或指定目录名称，缺省时默认值为 false
#
# 示例：
#   - name: smartdns
#     repo: pymumu/smartdns
#     keyword: x86_64-debian|x86_64-linux
#     exec: smartdns
#     type: deb|tar.gz
#     extract: tar.gz
#     keep_pkg: tar.gz
#     target_base: _pkgs
# ====================================================================

binaries:
  - name: mosdns
    repo: yyysuo/mosdns
    keyword: mosdns-linux-amd64.zip|mosdns-linux-amd64-v3.zip
    exec: mosdns
    type: zip
    extract: zip
    keep_pkg: false
    target_base: _pkgs
    folder_rename: linux-amd64|linux-amd64-v3

  - name: smartdns
    repo: pymumu/smartdns
    keyword: x86_64-debian|x86_64-linux|x86_64-openwrt
    exec: smartdns
    type: deb|tar.gz|ipk
    extract: false
    keep_pkg: false
    target_base: _pkgs

  - name: sing-box
    repo: SagerNet/sing-box
    keyword: linux_amd64.deb|linux-amd64.tar.gz|linux-amd64-glibc.tar.gz|linux-amd64-musl.tar.gz
    exec: sing-box
    type: deb|tar.gz
    extract: tar.gz
    keep_pkg: false
    target_base: _pkgs
    folder_rename: linux_amd64|linux-amd64|linux-amd64-glibc|linux-amd64-musl

  - name: sing-box-releases
    repo: reF1nd/sing-box-releases
    keyword: amd64.deb|linux-amd64-glibc.tar.gz|linux-amd64-musl.tar.gz
    exec: sing-box
    type: deb|tar.gz
    extract: tar.gz
    keep_pkg: false
    target_base: _pkgs
    folder_rename: linux_amd64|linux-amd64-glibc|linux-amd64-musl

  - name: mihomo
    repo: MetaCubeX/mihomo
    keyword: mihomo-linux-amd64-v1-v|mihomo-linux-amd64-v2-v|mihomo-linux-amd64-v3-v
    exec: mihomo
    type: deb|gz
    extract: gz
    keep_pkg: false
    target_base: _pkgs
    folder_rename: linux-amd64-v1|linux-amd64-v2|linux-amd64-v3

  - name: adguardhome
    repo: AdguardTeam/AdGuardHome
    keyword: linux_amd64
    exec: adguardhome
    type: tar.gz
    extract: false
    keep_pkg: false
    target_base: _pkgs

  - name: dae
    repo: daeuniverse/dae
    keyword: linux-x86_64.|linux-x86_64_v2|linux-x86_64_v3
    exec: dae
    type: deb|tar.xz
    extract: false
    keep_pkg: false
    target_base: _pkgs
    folder_rename: linux-x86_64|linux-x86_64_v2|linux-x86_64_v3

  - name: routeros
    repo: elseif/MikroTikPatch
    keyword: chr*!legacy-bios*vmdk|chr*legacy-bios*vmdk
    exec: routeros
    type: zip
    extract: false
    keep_pkg: false
    target_base: _pkgs
    folder_rename: chr-uefi-vmdk|chr-legacy-vmdk
