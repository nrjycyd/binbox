# ====================================================================
# 二进制更新清单（manifest + 双 Releases 方案）
#
# release_repo : 本仓库 owner/repo，用于存放镜像 Releases；
#                留空则自动使用 GitHub Actions 的 GITHUB_REPOSITORY
#
# 双 release 结构：
#   pkgs      - 最新二进制（manifest.json 引用此 release，标记为 Latest）
#   pkgs-prev - 次新备份，随每次更新自动生成，回滚用
#
# asset 命名规则：{name}-{上游原始文件名}
#   - 原名开头若与 name 的某个前缀（不区分大小写、逐段缩短）匹配且后跟分隔符/结尾，
#     则剥掉该前缀及分隔符，如 sing-box-releases + sing-box-1.14.0-... -> sing-box-releases-1.14.0-...
#   - 清理按 {name}- 最长前缀归属，整组替换
#
# 每个 binaries 条目字段：
#   name   : 程序名，manifest key 与 asset 命名空间前缀
#   repo   : 上游仓库 "owner/repo"
#   verify : 完整性校验方式（默认 none）
#              none      - 仅 sha256
#              checksums - 校验上游 checksums.txt / SHA256SUMS
#              minisig   - 校验上游 .minisig 签名（需 Secret: MINISIGN_PUBKEY）
#   assets : 每个文件的显式条目
#     match   : 上游文件名匹配，* 通配，! 前缀排除，| 分隔多条件
#     type    : 文件类型（deb|ipk|gz|zip|tar.gz|tar.xz），兼作后缀校验
#     exec    : 解压后的可执行文件名（部署侧命名/加执行权限用）
#     extract : true=部署时解压，false=整包存放
#     dir     : 部署目录末级名（仅 ensure.sh 部署用，不再参与 asset 命名）
# ====================================================================

release_repo: ""

binaries:
  - name: mosdns
    repo: yyysuo/mosdns
    verify: none
    assets:
      - match: mosdns-linux-amd64.zip
        dir: linux-amd64
        type: zip
        exec: mosdns
        extract: true
      - match: mosdns-linux-amd64-v3.zip
        dir: linux-amd64-v3
        type: zip
        exec: mosdns
        extract: true

  - name: smartdns
    repo: pymumu/smartdns
    verify: none
    assets:
      - match: '*x86_64-debian*'
        dir: x86_64-debian
        type: deb
        exec: smartdns
        extract: false
      - match: '*x86_64-linux*'
        dir: x86_64-linux
        type: tar.gz
        exec: smartdns
        extract: false
      - match: '*x86_64-openwrt*'
        dir: x86_64-openwrt
        type: ipk
        exec: smartdns
        extract: false

  - name: sing-box
    repo: SagerNet/sing-box
    verify: none
    assets:
      - match: '*linux*amd64.deb'
        dir: linux_amd64
        type: deb
        exec: sing-box
        extract: false
      - match: '*linux*amd64.tar.gz|!*glibc*|!*musl*'
        dir: linux-amd64
        type: tar.gz
        exec: sing-box
        extract: true
      - match: '*linux*amd64-glibc.tar.gz'
        dir: linux-amd64-glibc
        type: tar.gz
        exec: sing-box
        extract: true
      - match: '*linux*amd64-musl.tar.gz'
        dir: linux-amd64-musl
        type: tar.gz
        exec: sing-box
        extract: true

  - name: sing-box-releases
    repo: reF1nd/sing-box-releases
    verify: none
    assets:
      - match: '*amd64.deb'
        dir: linux_amd64
        type: deb
        exec: sing-box
        extract: false
      - match: '*linux*amd64-glibc.tar.gz'
        dir: linux-amd64-glibc
        type: tar.gz
        exec: sing-box
        extract: true
      - match: '*linux*amd64-musl.tar.gz'
        dir: linux-amd64-musl
        type: tar.gz
        exec: sing-box
        extract: true

  - name: mihomo
    repo: MetaCubeX/mihomo
    verify: none
    assets:
      - match: 'mihomo-linux-amd64-v1-v*.gz'
        dir: linux-amd64-v1
        type: gz
        exec: mihomo
        extract: true
      - match: 'mihomo-linux-amd64-v1-v*.deb'
        dir: linux-amd64-v1
        type: deb
        exec: mihomo
        extract: false
      - match: 'mihomo-linux-amd64-v2-v*.gz'
        dir: linux-amd64-v2
        type: gz
        exec: mihomo
        extract: true
      - match: 'mihomo-linux-amd64-v2-v*.deb'
        dir: linux-amd64-v2
        type: deb
        exec: mihomo
        extract: false
      - match: 'mihomo-linux-amd64-v3-v*.gz'
        dir: linux-amd64-v3
        type: gz
        exec: mihomo
        extract: true
      - match: 'mihomo-linux-amd64-v3-v*.deb'
        dir: linux-amd64-v3
        type: deb
        exec: mihomo
        extract: false

  - name: adguardhome
    repo: AdguardTeam/AdGuardHome
    verify: none
    assets:
      - match: '*linux*amd64.tar.gz'
        dir: linux_amd64
        type: tar.gz
        exec: adguardhome
        extract: false

  - name: dae
    repo: daeuniverse/dae
    verify: none
    assets:
      - match: '*linux-x86_64.deb'
        dir: linux-x86_64
        type: deb
        exec: dae
        extract: false
      - match: '*linux-x86_64.tar.xz'
        dir: linux-x86_64
        type: tar.xz
        exec: dae
        extract: false

  - name: routeros
    repo: elseif/MikroTikPatch
    verify: none
    assets:
      - match: 'chr-*.vmdk.zip|!*legacy-bios*'
        dir: chr-uefi-vmdk
        type: zip
        exec: routeros
        extract: false
      - match: 'chr-*legacy-bios*.vmdk.zip'
        dir: chr-legacy-vmdk
        type: zip
        exec: routeros
        extract: false
